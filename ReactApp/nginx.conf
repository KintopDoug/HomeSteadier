server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is rewritten on every container start; never let it be cached, or a
    # client could keep pointing at a stale API URL after a redeploy.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # The entry point must never be cached — it names the current content-hashed bundle. A
    # stale index.html keeps a browser pinned to an old bundle across deploys (which is how a
    # cached client ended up calling the localhost dev API URL). The SPA fallback below and the
    # `index` directive both internal-redirect to /index.html, so this exact match covers direct
    # hits and client-side routes alike.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed build assets are immutable: their filename hash changes whenever their content does,
    # so they're safe to cache indefinitely — a new deploy ships a new index.html pointing at the
    # new hashes. This keeps the app fast without ever serving stale code.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: TanStack Router owns client-side routing, so any unknown path
    # must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
