server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is rewritten on every container start; never let it be cached, or a
    # client could keep pointing at a stale API URL after a redeploy.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: TanStack Router owns client-side routing, so any unknown path
    # must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
