# Run when commits are pushed to main (i.e. a PR is merged)
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HomeSteadier.AppHost
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_POSTGRES_USER: ${{ vars.AZURE_POSTGRES_USER }}
      AZURE_CERTIFICATE_NAME: ${{ vars.AZURE_CERTIFICATE_NAME }}
      AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
      # Pins the Postgres admin password and JWT signing key to their existing values across
      # both provision and deploy (azd deploy re-templates secured parameters too). Without
      # these, a from-scratch CI environment has no memory of the previously-generated secrets
      # and azd mints new ones, resetting the Postgres password (breaking existing DB
      # connections) and rotating the JWT key (logging everyone out) on every run.
      AZURE_PGSQL_PASSWORD: ${{ secrets.AZURE_PGSQL_PASSWORD }}
      AZURE_JWT_SIGNING_KEY: ${{ secrets.AZURE_JWT_SIGNING_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: | 
            8.x
            9.x
            10.x

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh


      - name: Provision Infrastructure
        run: azd provision --no-prompt

      # Deployed as two separate steps, API first, so a failed API deploy (e.g. a bad
      # migration) stops the job before the frontend deploys. Otherwise a partial failure
      # could leave a new frontend build talking to a stale API whose contract it no longer
      # matches (the frontend's models/API client are generated from the API's OpenAPI schema).
      - name: Deploy API
        run: azd deploy Homesteadier-API --no-prompt

      - name: Deploy Frontend
        run: azd deploy react-frontend --no-prompt

