# Runs Claude Code on GitHub's runners.
#   * Label an issue `claude-ready`  -> Claude works it per .claude/skills/work-issue and opens a PR.
#   * Comment `@claude ...` on an issue/PR (owner only) -> Claude responds / pushes fixes.
#   * Every PR gets a Claude review.
#
# One-time setup: install https://github.com/apps/claude on the repo and add the repo secret
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY (swap the input below).
#
# SECURITY: this is a public repo. Issue/comment text is attacker-controlled, so every job that can
# write code is gated on the repository owner. Do not loosen these `if:` conditions.
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One round at a time per PR: review -> QA -> decide -> fix -> push -> the next round. Without this, two
# overlapping rounds could both decide to fix and spend the whole retry budget at once. cancel-in-progress is
# off, so a queued round waits instead of killing the one that is mid-fix. Keyed by event name so the many
# (skipped) bot-comment runs on a PR cannot replace a queued pull_request run.
concurrency:
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  work-issue:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'claude-ready' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # A throwaway Postgres so the agent can verify against a real database (issue #60). Same image and settings
    # as the QA and fixer jobs, and the same image local dev runs (HomeSteadier.AppHost/AppHost.cs).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: homesteadier_admin
          POSTGRES_PASSWORD: qa-ci-throwaway
          POSTGRES_DB: homesteadier-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homesteadier_admin -d homesteadier-db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare hand-off directory
        run: mkdir -p "$RUNNER_TEMP/agent"

      # Work branch name: wip/<base branch>/claude/<issue number>-<issue title>. Computed here, not by the
      # model, so it is always well-formed. The title is attacker-controlled (public repo), so it goes in
      # via env (never interpolated into the script) and is reduced to [a-z0-9-] before use.
      - name: Compute work branch name
        id: branch
        env:
          BASE: ${{ github.event.repository.default_branch }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          full=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          slug=${full:0:50}
          # Cut at a word boundary rather than mid-word.
          if [ "${#full}" -gt 50 ] && [ "${full:50:1}" != "-" ]; then slug=${slug%-*}; fi
          slug=${slug%-}
          [ -n "$slug" ] || slug=issue
          name="wip/${BASE}/claude/${NUM}-${slug}"
          # A re-run for the same issue must not collide with a branch pushed by an earlier run.
          if git ls-remote --exit-code --heads origin "$name" > /dev/null 2>&1; then
            name="${name}-${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "work branch: $name"

      # ---- Database-backed verification (issue #60). Best effort: if either step fails the agent is told, and
      # must say so instead of claiming it verified against a database.
      # dotnet-ef 9.x, not the SDK's 10.x: it has to match the Microsoft.EntityFrameworkCore 9 packages. Needed
      # only by `dotnet gen` (EF scaffolding from the live schema).
      - name: Install dotnet-ef
        id: ef
        continue-on-error: true
        run: |
          dotnet tool install --global dotnet-ef --version "9.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Start the API against the database
        id: stack
        continue-on-error: true
        env:
          STACK_LOG_DIR: ${{ runner.temp }}/agent
        run: bash qa/stack.sh start-api

      # The work runs as three SEPARATE agent processes, not one agent calling a subagent: in an unattended
      # run, subagents are asynchronous and the process exits when the main agent ends its turn, so an
      # agent that "waits for the reviewer" simply never returns (issue #44's first run did exactly that:
      # it committed, launched the reviewer, ended its turn, and lost everything). Separate steps are also
      # more independent: the reviewer is a fresh process that never saw the implementer's reasoning.

      # ---- Stage 1: implement and commit locally. Cannot push (not in its tool list) and writes a hand-off.
      - id: implement
        uses: anthropics/claude-code-action@v1
        env:
          POSTGRES_PASSWORD: qa-ci-throwaway
          STACK_LOG_DIR: ${{ runner.temp }}/agent
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the IMPLEMENTER stage of an unattended, multi-stage run for GitHub issue
            #${{ github.event.issue.number }}. Follow .claude/skills/work-issue/SKILL.md steps 1-4 ONLY
            (eligibility, branch, implement, verify), then commit locally. Then STOP:
            - Do NOT push, do NOT open a PR, and do NOT use any Agent/Task/subagent tool. Separate later
              stages, each its own process, review your commit, push, and open the PR. Ending your turn
              ends your process.
            - Create the branch with EXACTLY this name (it is computed for you; do not alter it):
              `git switch --no-track -c ${{ steps.branch.outputs.name }} origin/${{ github.event.repository.default_branch }}`.
            - Write `${{ runner.temp }}/agent/implement.md`. Its FIRST line must be exactly
              `STATUS: committed` or `STATUS: stopped`. Then: branch name; what changed and why (2-5
              bullets); the exact verification commands you ran and their results; what you could NOT
              verify; risks for the reviewer.
            - If you stop WITHOUT committing (blocked, needs-human, ambiguous, a command failed), post
              the exact reason or question with `gh issue comment ${{ github.event.issue.number }}
              --body-file <file>` and write `STATUS: stopped`.
            - DATABASE: a throwaway Postgres (the same image local dev runs) is available and the API
              ${{ steps.stack.outcome == 'success' && 'IS running' || 'is NOT running because it failed to start; verify what you can and say plainly in implement.md that you could NOT verify against a database' }}
              at http://localhost:5128. Use it to VERIFY, not just to build. `bash qa/stack.sh signup` creates a
              test user and saves its token; then `bash qa/stack.sh call GET /api/Farm` (or POST/PUT/PATCH/DELETE
              with a JSON body) calls the live API as that user, and `call --token <jwt> ...` as another user (e.g. to
              prove a 403). Never put VAR=value in front of these commands: the allowlist matches commands that start
              with `bash qa/stack.sh`. After changing API code run `bash qa/stack.sh restart-api` before testing it.
              For schema or API-surface work regenerate with `bash qa/stack.sh cli database update`, then
              `bash qa/stack.sh cli dotnet gen`, then `bash qa/stack.sh cli packages gen` (generated files must come from
              these commands, never be hand-edited; dotnet-ef, which `dotnet gen` needs,
              ${{ steps.ef.outcome == 'success' && 'installed fine' || 'FAILED to install, so `dotnet gen` will not work: say so' }}). Generator output can include changes unrelated to your work (for
              example, the committed AuthApi.tsx may differ in route casing): revert unrelated changes with git checkout
              and mention it. In implement.md list the exact commands you ran against the database and what they returned.
            Your final message is discarded; nobody reads it.
          claude_args: >-
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git checkout:*),Bash(git fetch:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(dotnet:*),Bash(npm:*),Bash(npx:*),Bash(cd:*),Bash(mkdir:*),Bash(bash qa/stack.sh:*)"
      - if: always()
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/agent/transcript-1-implement.json" 2>/dev/null || true
      - id: gate
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          f="$RUNNER_TEMP/agent/implement.md"
          commits=$(git rev-list --count "origin/${BASE}..HEAD" 2>/dev/null || echo 0)
          if [ -f "$f" ] && [ "$(head -1 "$f" | tr -d '\r')" = "STATUS: committed" ] && [ "$commits" -gt 0 ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commits ahead of main: $commits; handoff present: $([ -f "$f" ] && echo yes || echo no)"
      # Safety net: a run must never end with no PR and no explanation.
      - name: Report if the implementer stopped without saying why
        if: steps.gate.outputs.committed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          f="$RUNNER_TEMP/agent/implement.md"
          if [ -f "$f" ] && [ "$(head -1 "$f" | tr -d '\r')" = "STATUS: stopped" ]; then
            echo "Implementer stopped and already explained itself."; exit 0
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "The agent ended without committing any work and without explaining why. See the [run]($RUN_URL) (transcript artifact kept 3 days)."

      # ---- Stage 2: independent pre-PR review. Fresh process, read-only; never sees the implementer's reasoning.
      - id: review
        if: steps.gate.outputs.committed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the independent PRE-PR REVIEWER for issue #${{ github.event.issue.number }}. Read
            `.claude/agents/pre-pr-reviewer.md` and follow it exactly (ignore its frontmatter): review
            `git diff origin/main...HEAD` against the issue. You did not write this code. Do NOT read
            anything in `${{ runner.temp }}/agent/` and do NOT edit any repository file. Write your reply,
            in exactly the format that file specifies, to `${{ runner.temp }}/agent/review.md`.
            Your final message is discarded; nobody reads it.
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),Bash(gh issue view:*)"
      - if: always()
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/agent/transcript-2-review.json" 2>/dev/null || true

      # ---- Stage 3: finalize. Addresses blockers, pushes the branch, opens the PR, and reports on the issue.
      - id: publish
        if: steps.gate.outputs.committed == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          POSTGRES_PASSWORD: qa-ci-throwaway
          STACK_LOG_DIR: ${{ runner.temp }}/agent
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the FINALIZER stage for issue #${{ github.event.issue.number }}. Inputs:
            `${{ runner.temp }}/agent/implement.md` (the implementer's report) and
            `${{ runner.temp }}/agent/review.md` (the independent reviewer's verdict; it may be missing
            or malformed if that stage failed). The work is already committed on the current branch.
            1. If the review says CHANGES_REQUESTED, fix each blocker (or, if you disagree, write down
               why), re-run the verification from .claude/skills/work-issue/SKILL.md step 4 (including the
               database-backed checks: `bash qa/stack.sh restart-api` first if you changed API code), and commit.
               No second review happens in this run: say so in the PR body.
            2. Push the current branch to a branch of the same name: `git push -u origin HEAD`. NEVER push
               to `main`, never force-push, never merge.
            3. Open the PR per .claude/skills/work-issue/SKILL.md step 6: title `#<n>: <summary>`,
               `Closes #<n>`, verification details (name the commands run against the database, from
               implement.md plus yours; say "not verified against a database" ONLY if the stack was down: it
               ${{ steps.stack.outcome == 'success' && 'was up' || 'was DOWN' }} in this run), and a "Pre-PR review" section quoting the reviewer's
               VERDICT, issue coverage and blockers and what you did about each. Open it as a DRAFT if
               the review is missing/malformed, any blocker is unresolved, or it touches
               auth/migrations/infra.
            4. Your LAST action: `gh issue comment ${{ github.event.issue.number }} --body-file <file>`
               with the PR link, or the exact error if pushing/PR creation failed. Never finish silently.
            Your final message is discarded; nobody reads it.
          claude_args: >-
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(dotnet:*),Bash(npm:*),Bash(npx:*),Bash(cd:*),Bash(mkdir:*),Bash(bash qa/stack.sh:*)"
      - if: always()
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/agent/transcript-3-publish.json" 2>/dev/null || true

      # The action hides the transcript and posts nothing itself, so keep each stage's briefly for debugging.
      # NOTE: artifacts on a public repo are readable by any signed-in GitHub user; these hold only
      # issue/repo content (GitHub masks secrets), hence the short retention.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-work-issue-transcript
          path: |
            ${{ runner.temp }}/agent/transcript-*.json
            ${{ runner.temp }}/agent/implement.md
            ${{ runner.temp }}/agent/review.md
            ${{ runner.temp }}/agent/api.log
          retention-days: 3
          if-no-files-found: ignore

  mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(dotnet:*),Bash(npm:*),Bash(npx:*)"

  review:
    # Independent post-PR reviewer (the second of two: .claude/agents/pre-pr-reviewer.md runs earlier,
    # inside work-issue, before the PR exists). Never pushes. Skipped for fork PRs (no secrets).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Deliberately NO dotnet/node setup and no build commands: this job holds the Claude token,
      # and building a PR runs its code (npm scripts, MSBuild targets). ci.yml builds PRs without
      # secrets; the reviewer reads that result instead of re-running it.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs opened by the agent have the Claude bot as actor, which the action rejects by
          # default. Allow only that bot (not '*'): any other bot could otherwise spend this token.
          allowed_bots: "claude"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} by following
            .claude/skills/pr-review/SKILL.md exactly. Leave inline comments and one summary
            comment. Do not approve, merge, or push commits.
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"

  # How many automatic fix attempts this issue has used so far, counted from marker comments that only
  # github-actions[bot] can author (so a stranger cannot spend or reset the budget). Lets QA re-run after a
  # fix push without re-running on every unrelated push.
  ctx:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      attempts: ${{ steps.count.outputs.attempts }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          target=${issue:-$PR}
          used=$(gh api --paginate "repos/$GH_REPO/issues/$target/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- claude-fix-attempt -->")) | .id' | wc -l | tr -d ' ')
          echo "automatic fix attempts used on #$target: $used"
          echo "attempts=$used" >> "$GITHUB_OUTPUT"

  # Functional QA: after the first successful review (opened / ready_for_review), and again after every push
  # that follows an automatic fix attempt, so a fix is re-tested and not just re-reviewed. Re-run by hand with
  # `gh workflow run qa.yml -f pr_number=<n>`. See qa.yml for the design.
  qa:
    needs: [review, ctx]
    if: >-
      github.event_name == 'pull_request' &&
      needs.review.result == 'success' &&
      (github.event.action != 'synchronize' || needs.ctx.outputs.attempts != '0')
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    uses: ./.github/workflows/qa.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  # The decision point of the automatic review/QA/fix loop. It runs after BOTH review and QA have posted, reads
  # their verdicts (from this run's comments only), and does exactly one of:
  #   - everything passed, or there is no verdict       -> stop
  #   - review "changes requested" or QA FAIL/INCONCLUSIVE and fewer than MAX_FIX_ATTEMPTS used -> start the fixer
  #   - same, but the budget is spent                   -> label the issue and PR needs-human, stop
  # The fixer's push re-triggers this whole workflow (review, QA, decide), so the loop is: at most 2 fix attempts,
  # each followed by a full review + QA, and then a human. Only PRs authored by the owner or claude[bot] qualify.
  autofix:
    needs: [review, qa, ctx]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.review.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'claude[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          MAX_FIX_ATTEMPTS: "2" # keep in sync with claude-fix.yml
        run: |
          set -euo pipefail
          echo "action=none" >> "$GITHUB_OUTPUT"

          # Only comments written during THIS run count, so an old "changes requested" cannot restart the loop.
          since=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .created_at)
          comments=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments?per_page=100" | jq -s 'add // []')
          latest() { # author, marker -> body of the newest matching comment (empty if none)
            jq -r --arg a "$1" --arg m "$2" --arg since "$since" \
              '[.[] | select(.user.login == $a and .created_at >= $since and (.body | contains($m)))] | last | .body // ""' <<< "$comments"
          }
          review_line=$(latest 'claude[bot]' '**Verdict:**' | grep -m1 -i '\*\*Verdict:\*\*' || true)
          qa_body=$(latest 'github-actions[bot]' '<!-- qa-report -->')
          qa_line=$(printf '%s\n' "$qa_body" | grep -m1 '^## Functional QA' || true)
          echo "review verdict: ${review_line:-<none this run>}"
          echo "QA verdict:     ${qa_line:-<none this run>}"

          reasons=()
          if printf '%s' "$review_line" | grep -qi 'changes requested'; then
            reasons+=("review requested changes")
          fi
          if printf '%s' "$qa_line" | grep -qE 'FAIL|INCONCLUSIVE'; then
            # If the stack never ran (planning or startup failed) no code edit can fix it; do not burn an attempt.
            if printf '%s' "$qa_body" | grep -qE 'No test results were produced|planning stage failed'; then
              echo "QA could not run (infrastructure); not treated as a code failure"
            else
              reasons+=("QA $(printf '%s' "$qa_line" | grep -oE 'FAIL|INCONCLUSIVE' | head -1)")
            fi
          fi
          if [ "${#reasons[@]}" -eq 0 ]; then
            echo "Nothing is failing (or there is no verdict to act on). Stopping."
            exit 0
          fi
          why=$(printf '%s; ' "${reasons[@]}"); why=${why%; }

          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,needs-human,*) echo "Already labelled needs-human; leaving it to a person."; exit 0 ;;
          esac

          issue=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          target=${issue:-$PR}
          used=$(gh api --paginate "repos/$GH_REPO/issues/$target/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- claude-fix-attempt -->")) | .id' | wc -l | tr -d ' ')
          echo "Failing: $why. Automatic fix attempts used on #$target: $used of $MAX_FIX_ATTEMPTS."

          if [ "$used" -ge "$MAX_FIX_ATTEMPTS" ]; then
            gh label create needs-human --color b60205 --description "Needs a human decision or review before an agent works it" 2>/dev/null || true
            gh pr edit "$PR" --add-label needs-human
            [ -z "$issue" ] || gh issue edit "$issue" --add-label needs-human
            printf '%s\n' "**Escalating to a human.** After $used automatic fix attempt(s) on #$target (the limit), this PR still fails: $why. Labelled \`needs-human\`; no further automatic fixes." \
              | gh pr comment "$PR" --body-file -
            exit 0
          fi

          echo "action=fix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "Checks did not pass ($why). Starting automatic fix attempt **$((used + 1)) of $MAX_FIX_ATTEMPTS**. Review and QA run again after it pushes." \
            | gh pr comment "$PR" --body-file -

  # Runs the fixer (claude-fix.yml) when the decision job says so. Called as a reusable workflow so the event
  # context (the PR, the actor) is the same one the review and QA already ran under.
  fix:
    needs: autofix
    # !cancelled() overrides the implicit success(): qa/report goes red on a FAIL verdict, which is exactly when a fix is wanted.
    if: ${{ !cancelled() && needs.autofix.outputs.action == 'fix' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/claude-fix.yml
    secrets: inherit
